<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>김창대 ♥ 조은총 결혼예배 순서지</title>
<meta property="og:title" content="김창대 ♥ 조은총 결혼예배 순서지">
<meta property="og:image" content="https://wedding.prosperproduction.com/order/01.jpg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14181a;overflow:hidden;font-family:-apple-system,"Noto Sans KR",sans-serif}
#track{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior:contain}
#track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;overflow:auto;display:flex;align-items:center;justify-content:center;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide img{width:100%;max-height:100dvh;object-fit:contain;display:block;will-change:transform,opacity;transition:width .35s ease}
.slide.zoom{align-items:flex-start;justify-content:flex-start}
.slide.zoom img{width:220%;max-width:none;max-height:none}
#dots{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;pointer-events:none}
#dots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.35);transition:all .35s ease}
#dots i.on{width:26px;background:#b7c9b0}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:none;cursor:pointer}
#prev{left:12px}#next{right:12px}
@media(hover:hover){.nav{display:block}}
#hint{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 18px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;white-space:nowrap;animation:fade 4.5s ease forwards;pointer-events:none}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
</style></head><body>
<div id="track"></div><div id="dots"></div>
<button class="nav" id="prev">‹</button><button class="nav" id="next">›</button>
<div id="hint">옆으로 넘겨보세요 · 두 번 탭하면 확대</div>
<script>
var pages=['01.jpg','02.jpg']; // 페이지 추가 시 여기에 파일명 추가
var track=document.getElementById('track'),dots=document.getElementById('dots'),slides=[],cur=0;
pages.forEach(function(src,i){
  var s=document.createElement('div');s.className='slide';
  var im=new Image();im.src=src;im.alt='순서지 '+(i+1);im.draggable=false;
  s.appendChild(im);track.appendChild(s);slides.push(s);
  dots.appendChild(document.createElement('i'));
  s.addEventListener('dblclick',function(){s.classList.toggle('zoom');track.style.overflowX=s.classList.contains('zoom')?'hidden':'auto';if(!s.classList.contains('zoom'))s.scrollTo(0,0)});
});
function go(n){n=Math.max(0,Math.min(pages.length-1,n));track.scrollTo({left:n*track.clientWidth,behavior:'smooth'})}
function update(){
  var w=track.clientWidth,p=track.scrollLeft/w;
  slides.forEach(function(s,i){var d=i-p,a=Math.min(Math.abs(d),1),im=s.firstChild;
    im.style.opacity=1-a*.7;im.style.transform='translateX('+(d*-18)+'%) scale('+(1-a*.1)+')'});
  var n=Math.round(p);if(n!==cur){slides[cur].classList.remove('zoom');track.style.overflowX='auto';cur=n}
  [].forEach.call(dots.children,function(d,i){d.className=i===n?'on':''});
}
track.addEventListener('scroll',function(){requestAnimationFrame(update)});
document.getElementById('prev').onclick=function(){go(cur-1)};
document.getElementById('next').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
window.addEventListener('resize',function(){go(cur)});
update();
</script></body></html>
